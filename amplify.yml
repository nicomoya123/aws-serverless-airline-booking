version: 0.1
frontend:
  phases:
    preBuild:
      commands:
        - cd src/frontend
        - export COGNITO_USER_POOL_ID=$(aws ssm get-parameter --name /archive/service/amplify/auth/userpool/id --query 'Parameter.Value' --output text --region us-east-1)
        - export COGNITO_CLIENT_ID=$(aws ssm get-parameter --name /archive/service/amplify/auth/userpool/clientId --query 'Parameter.Value' --output text --region us-east-1)
        - export APPSYNC_URL=$(aws ssm get-parameter --name /archive/service/amplify/api/url --query 'Parameter.Value' --output text --region us-east-1)
        - export APPSYNC_API_ID=$(aws ssm get-parameter --name /archive/service/amplify/api/id --query 'Parameter.Value' --output text --region us-east-1)
        - export APPSYNC_API_KEY=$(aws appsync list-api-keys --api-id $APPSYNC_API_ID --query 'apiKeys[0].id' --output text --region us-east-1)
        - export PAYMENT_CHARGE_URL=$(aws ssm get-parameter --name /archive/service/payment/api/charge/url --query 'Parameter.Value' --output text --region us-east-1)
        - >
          python3 -c "
          import json, os;
          config = {
            'aws_project_region': 'us-east-1',
            'aws_cognito_region': 'us-east-1',
            'aws_user_pools_id': os.environ['COGNITO_USER_POOL_ID'],
            'aws_user_pools_web_client_id': os.environ['COGNITO_CLIENT_ID'],
            'aws_appsync_graphqlEndpoint': os.environ['APPSYNC_URL'],
            'aws_appsync_region': 'us-east-1',
            'aws_appsync_authenticationType': 'AMAZON_COGNITO_USER_POOLS',
            'aws_appsync_apiKey': os.environ['APPSYNC_API_KEY']
          };
          f = open('aws-exports.js', 'w');
          f.write('const awsmobile = ' + json.dumps(config, indent=2) + ';\nexport default awsmobile;\n');
          f.close()
          "
        - cat aws-exports.js
        - echo "StripePublicKey=${STRIPE_PUBLIC_KEY}" > .prod.env
        - echo "PaymentChargeUrl=${PAYMENT_CHARGE_URL}" >> .prod.env
        - cat .prod.env
        - nvm use 16
        - yarn
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: src/frontend/dist/spa
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    - pattern: "**/*"
      headers:
        - key: "Strict-Transport-Security"
          value: "max-age=31536000; includeSubDomains"
        - key: "X-Content-Type-Options"
          value: "nosniff"
        - key: "X-XSS-Protection"
          value: "1; mode=block"
        - key: "X-Frame-Options"
          value: "DENY"
        - key: "Referrer-Policy"
          value: "same-origin"
        - key: "Feature-Policy"
          value: "microphone 'none'; camera 'none'; notifications 'self'"
        - key: "Content-Security-Policy"
          value: "default-src 'none'; connect-src https://*.amazonaws.com; font-src 'self' https://fonts.gstatic.com; frame-src https://js.stripe.com; img-src 'self'; script-src 'self' 'unsafe-eval' https://js.stripe.com/v3/; style-src 'self' https://fonts.googleapis.com/css?family=Raleway 'unsafe-inline' https://fonts.googleapis.com"
